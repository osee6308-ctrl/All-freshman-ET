async function syncRemoteContent(){
  if(!CONFIG.CONTENT_URL) return;
  const base = CONFIG.CONTENT_URL.replace(/\/+$/,'');
  const localVersion = localStorage.getItem(LS_SYNCED_VERSION) || '0';
  let remoteVersion = null;
  try { const vRes = await fetch(base + '/version.json?t=' + Date.now(), { cache:'no-store' }); if (vRes.ok) { const vData = await vRes.json(); remoteVersion = String(vData.version || '1'); if (remoteVersion === localVersion && localStorage.getItem(LS_SYNCED_CONTENT)) return; } } catch(e){}
  try {
    const res = await fetch(base + '/content.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json(); if (!remote) return;
    localStorage.setItem(LS_SYNCED_CONTENT, JSON.stringify(remote));
    localStorage.setItem(LS_SYNCED_VERSION, remoteVersion || String(remote.version || '1'));
    localStorage.setItem(LS_SYNCED_UPDATED, String(remote.updated || ''));
    if (remote.tutorials) saveTutorials(remote.tutorials);
    if (remote.universityInfo && typeof remote.universityInfo === 'object') localStorage.setItem(LS_UNI_INFO, JSON.stringify(remote.universityInfo));
    if (remote.generalSubjects && typeof remote.generalSubjects === 'object') localStorage.setItem(LS_GENERAL_SUBJECTS, JSON.stringify(remote.generalSubjects));
    if (remote.settings){ const cur = getSettings(); const re = remote.settings._adminEdited || 0; const le = cur._adminEdited || 0; if (re > le){ saveSettings({...cur, ...remote.settings}); reloadConfig(); } }
  } catch(e){}
}

    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;';

    else if(type === 'confirm') inner = '<div style="font-size:15px;color:#333;line-height:1.6;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(message)+'</div><div style="display:flex;gap:8px;"><button id="appDlgCancel" class="btn btn-ghost" style="flex:1;">Cancel</button><button id="appDlgOk" class="btn btn-primary" style="flex:1;">OK</button></div>';

    overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);">'+inner+'</div>';
    document.body.appendChild(overlay);
    const okBtn = document.getElementById('appDlgOk'); const cancelBtn = document.getElementById('appDlgCancel'); const inputEl = document.getElementById('appDlgInput');
    const cleanup = () => { overlay.remove(); };
    okBtn.onclick = () => { cleanup(); resolve(type === 'prompt' ? (inputEl ? inputEl.value : '') : true); };
    if(cancelBtn) cancelBtn.onclick = () => { cleanup(); resolve(type === 'prompt' ? null : false); };
    if(inputEl) setTimeout(()=>{ try{ inputEl.focus(); }catch(e){} }, 50);
  });
}

async function handleAndroidBack() {

  if (_screenStack.length > 0) { const prev = _screenStack.pop(); _goingBack = true; try { _renderScreenByName(prev); } finally { setTimeout(() => { _goingBack = false; }, 100); } return; }

let adminBulkMode = false;
let adminSelected = new Set();
function adminResetBulkSelection(){ adminBulkMode = false; adminSelected.clear(); }
function adminToggleBulkMode(type){ adminBulkMode = !adminBulkMode; adminSelected.clear(); renderAdminContentManager(type); }
function adminToggleSelect(idx){ if (adminSelected.has(idx)) adminSelected.delete(idx); else adminSelected.add(idx); renderAdminContentManager(adminEditState.tab); }
async function adminDeleteSelected(type){
  if (adminSelected.size === 0) return appAlert('Nothing selected.');
  if (!(await appConfirm('Delete ' + adminSelected.size + ' item(s)?'))) return;
  const uni = adminEditState.uni; const stream = adminEditState.stream; const sem = adminEditState.semester || 1;
  const c = getUniContent(uni, stream, sem);
  let arr;
  if (type === 'book') arr = c.pdfs;
  else if (type === 'note') arr = c.notes;
  else if (type === 'exam') arr = c.exams;
  else if (type === 'coc') { c.cocs = c.cocs || []; arr = c.cocs; }
  const indices = Array.from(adminSelected).sort((a,b)=>b-a);
  indices.forEach(i => { if (i >= 0 && i < arr.length) arr.splice(i, 1); });
  setUniContent(uni, stream, sem, c);
  const count = indices.length;
  adminResetBulkSelection();
  await appAlert('✅ Deleted ' + count + ' item(s).');
  renderAdminContentManager(type);
}
async function adminCopyMoveSelected(type, action){
  if (adminSelected.size === 0) return appAlert('Select items first.');
  const srcUni = adminEditState.uni;
  const srcStream = adminEditState.stream;
  const srcSem = adminEditState.semester || 1;
  const srcLabel = srcUni + ' · ' + srcStream + ' · Sem ' + srcSem;
  const uniOpts = CONFIG.UNIVERSITIES.map(u => '<option value="'+escapeHtml(u)+'" '+(u===srcUni?'selected':'')+'>'+escapeHtml(u)+'</option>').join('');
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto;';
  overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;">' +
    '<h2 style="font-size:17px;margin-bottom:6px;color:#333;">'+(action==='copy'?'📋 Copy':'📦 Move')+' '+adminSelected.size+' item(s)</h2>' +
    '<p style="font-size:12.5px;color:#666;margin-bottom:14px;">From: <strong>'+escapeHtml(srcLabel)+'</strong></p>' +
    '<label class="field-label">Target University</label>' +
    '<select id="copyTargetUni" class="field-select" style="margin-bottom:10px;">'+uniOpts+'</select>' +
    '<label class="field-label">Target Stream</label>' +
    '<select id="copyTargetStream" class="field-select" style="margin-bottom:10px;">' +
      '<option value="Natural" '+(srcStream==='Natural'?'selected':'')+'>Natural</option>' +
      '<option value="Social" '+(srcStream==='Social'?'selected':'')+'>Social</option>' +
    '</select>' +
    '<label class="field-label">Target Semester</label>' +
    '<select id="copyTargetSem" class="field-select" style="margin-bottom:10px;">' +
      '<option value="1" '+(srcSem===1?'selected':'')+'>1st Semester</option>' +
      '<option value="2" '+(srcSem===2?'selected':'')+'>2nd Semester</option>' +
    '</select>' +
    (action==='move'?'<div style="background:#fff3cd;border-left:4px solid #ff9800;border-radius:8px;padding:10px;font-size:12px;color:#856404;margin-bottom:10px;"><strong>⚠️ Move</strong> removes them from source.</div>':'<div style="background:#e3f2fd;border-left:4px solid #2196f3;border-radius:8px;padding:10px;font-size:12px;color:#1565c0;margin-bottom:10px;"><strong>📋 Copy</strong> keeps them at source.</div>') +
    '<div style="display:flex;gap:8px;margin-top:12px;">' +
      '<button class="btn btn-ghost" style="flex:1;" id="copyCancelBtn">Cancel</button>' +
      '<button class="btn btn-primary" style="flex:1;" id="copyConfirmBtn">'+(action==='copy'?'Copy':'Move')+'</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(overlay);
  document.getElementById('copyCancelBtn').onclick = () => overlay.remove();
  document.getElementById('copyConfirmBtn').onclick = async () => {
    const tUni = document.getElementById('copyTargetUni').value;
    const tStream = document.getElementById('copyTargetStream').value;
    const tSem = parseInt(document.getElementById('copyTargetSem').value) || 1;
    if (tUni === srcUni && tStream === srcStream && tSem === srcSem) { return appAlert('Target is the same as source.'); }
    const srcC = getUniContent(srcUni, srcStream, srcSem);
    const tgtC = getUniContent(tUni, tStream, tSem);
    let arrSrc, arrTgt;
    if (type === 'book') { arrSrc = srcC.pdfs; arrTgt = tgtC.pdfs; }
    else if (type === 'note') { arrSrc = srcC.notes; arrTgt = tgtC.notes; }
    else if (type === 'exam') { arrSrc = srcC.exams; arrTgt = tgtC.exams; }
    else if (type === 'coc') { srcC.cocs = srcC.cocs || []; tgtC.cocs = tgtC.cocs || []; arrSrc = srcC.cocs; arrTgt = tgtC.cocs; }
    const indices = Array.from(adminSelected).sort((a,b)=>a-b);
    const itemsToCopy = indices.map(i => JSON.parse(JSON.stringify(arrSrc[i]))).filter(Boolean);
    itemsToCopy.forEach(it => arrTgt.push(it));
    if (action === 'move') { indices.slice().sort((a,b)=>b-a).forEach(i => { if (i>=0 && i<arrSrc.length) arrSrc.splice(i,1); }); }
    setUniContent(tUni, tStream, tSem, tgtC);
    if (action === 'move') setUniContent(srcUni, srcStream, srcSem, srcC);
    overlay.remove();
    adminResetBulkSelection();
    await appAlert('✅ ' + itemsToCopy.length + ' item(s) ' + (action==='copy'?'copied':'moved') + ' to ' + tUni + ' · ' + tStream + ' · Sem ' + tSem);
    renderAdminContentManager(type);
  };
}

async function submitSignIn(){
  const phone=(document.getElementById('siPhone').value||'').trim(); const pw=document.getElementById('siPw').value;
  const msg=document.getElementById('siMsg'); const btn=document.getElementById('siSubmitBtn');
  const err = t => { msg.innerHTML='<div style="color:#c62828; font-weight:600;">'+t+'</div>'; };
  const ok  = t => { msg.innerHTML='<div style="color:#2e7d32; font-weight:600;">'+t+'</div>'; };
  if(!/^(09|07)\d{8}$/.test(phone)) return err('Enter valid phone (09/07 + 8 digits).');
  if(!isValidPassword(pw)) return err('Password must be at least 4 characters.');
  if(isPhoneBlacklisted(phone)){ err('Account blocked.'); setTimeout(()=>renderBlockedScreen(),1200); return; }
  if(btn){ btn.disabled=true; btn.textContent='⏳ Verifying…'; }
  await new Promise(r => setTimeout(r, 50));
  try {
    let user = findLocalUser(phone); let fromServer = false;
    if (!user) { const remote = findRemoteUser(phone); if (remote) { saveUser(remote); user = remote; } }
    let graceGranted = false;
    if (user) {
      const backendRes = await backendUpdateUser({ phone: user.phone, passwordHash: user.passwordHash, deviceHash: getDeviceHash() });
      if (backendRes && backendRes.gracePeriod) { graceGranted = true; localStorage.setItem(LS_GRACE_UNTIL, Date.now() + (12 * 60 * 60 * 1000)); }
    }
    if (!user) { const resp = await backendGetUser(phone); if (resp && resp.ok && resp.user) { user = resp.user; user.deviceId = getDeviceId(); user.deviceHash = getDeviceHash(); saveUser(user); markPhoneUsed(phone); fromServer = true; } }
    if (!user) { if(btn){ btn.disabled=false; btn.textContent='Sign In'; } return err('No account found for this phone. Please sign up first.'); }
    const valid = await verifyPasswordAsync(phone, pw, user);
    if (!valid) { if(btn){ btn.disabled=false; btn.textContent='Sign In'; } return err('Wrong password. Please try again.'); }
    user.deviceId = getDeviceId(); user.deviceHash = getDeviceHash(); saveUser(user); setCurrentUserPhone(phone);
    saveProfileData({ name:user.name, phone:user.phone, university:user.university, stream:user.stream });
    setUniversity(user.university); setCheckedIn(); startSession(phone); markPhoneUsed(phone);
    ok('✓ Signed in!'); 
    pushStatusToServer();
    setTimeout(()=>{ 
      showPostAuthWarning(()=>{ 
        _clearNavStack(); 
        if (graceGranted) { appAlert('Welcome back! You have been granted a 12-hour grace period. Please contact Admin after 12 hours to renew your license.'); }
        switchTab('book'); 
      }); 
    }, 400);
  } catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Sign In'; } err('Sign-in failed. Please try again.');
  }
}

  let score=0; quizState.questions.forEach((q,i)=>{ if(quizState.answers[i]===q.answer) score++; });
  const pct=Math.round((score/total)*100); const g=gradeFor(pct); saveHistory({subject:quizState.subjectName,score,total,date:Date.now()});
  const reviewHTML=quizState.questions.map((q,i)=>{ const ua=quizState.answers[i]; const ok=ua===q.answer; const to=ua===-1; return '<div class="review-item '+(ok?'correct':'wrong')+'"><div class="rq">'+(i+1)+'. '+escapeHtml(q.q)+'</div><div class="ra">Your answer: <span style="color:'+(ok?'#2e7d32':'#c62828')+'; font-weight:600;">'+(to?'Timed out':(ua!==undefined&&q.options[ua]?escapeHtml(q.options[ua]):'-'))+'</span>'+(!ok?'<br>Correct: <span style="color:#2e7d32; font-weight:600;">'+escapeHtml(q.options[q.answer])+'</span>':'')+(q.explanation?'<div style="margin-top:8px; padding:10px; background:#fff8e1; border-radius:8px; font-size:12.5px; color:#5d4037;"><strong style="color:#ff8f00;">Note:</strong> '+escapeHtml(q.explanation)+'</div>':'')+'</div></div>'; }).join('');
  window._retakeName=quizState.subjectName; window._retakeQuestions=quizState.rawQuestions; window._retakeTime=quizState.timeMinutes;
  app.innerHTML=renderHeader(currentTab)+'<div class="result-card">'+(autoTimeout?'<div style="background:#ffebee; color:#c62828; padding:10px; border-radius:10px; margin-bottom:16px; font-weight:700;">Time up!</div>':'')+'<div class="score-circle" style="background:'+g.color+'"><div class="pct">'+pct+'%</div><div class="grade">Grade '+g.letter+'</div></div><h2>'+(pct>=60?'Well done!':'Keep studying!')+'</h2><p class="sub">'+score+'/'+total+' · Time: '+formatTime(quizState.seconds)+'</p><button class="btn btn-primary btn-full" onclick="retakeExam()">Retake</button><button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="switchTab(\''+currentTab+'\')">Back</button><div class="review"><h3>Review</h3>'+reviewHTML+'</div></div>'+renderBottomNav(currentTab)+renderChatFab();
}
function retakeExam(){ startQuiz(window._retakeName, window._retakeQuestions, window._retakeTime); }

const getHistory=()=>JSON.parse(localStorage.getItem('fs_hub_history')||'[]');
function saveHistory(e){
  const h=getHistory(); h.unshift(e);
  localStorage.setItem('fs_hub_history', JSON.stringify(h.slice(0,30)));
  backendSaveProgress(e).then(r => { if (r && r.ok) console.log('✅ progress synced'); }).catch(()=>{});
}
function clearHistory(){ appConfirm('Clear local history?').then(ok=>{ if(!ok) return; localStorage.removeItem('fs_hub_history'); renderProgress(); }); }
function computeStats(){ const h=getHistory(); let s=0,b=0,w=100; h.forEach(x=>{ const p=(x.score/x.total)*100; s+=p; if(p>b)b=p; if(p<w)w=p; }); return { total:h.length, avg:h.length?Math.round(s/h.length):0, best:Math.round(b), worst:h.length?Math.round(w):0 }; }

async function renderProgress(){
  setScreen('user-progress');
  app.innerHTML = renderHeader('my') + '<div class="panel"><h2>My Progress</h2><div class="empty-msg">Loading…</div></div>' + renderBottomNav('my') + renderChatFab();
  let list = getHistory();
  const r = await backendGetMyProgress();
  if (r && r.ok && Array.isArray(r.progress) && r.progress.length) {
    list = r.progress.map(x => ({ subject:x.subject, score:x.score, total:x.total, date:x.at }));
  }
  const rows = list.length ? list.map(x => {
    const pct = Math.round((x.score / x.total) * 100);
    return '<div class="history-item"><span>' + escapeHtml(x.subject) + '</span><span class="score-badge ' + (pct < 60 ? 'low' : '') + '">' + x.score + '/' + x.total + ' — ' + pct + '%</span></div>';
  }).join('') : '<div class="empty-msg">No attempts yet.</div>';
  app.innerHTML = renderHeader('my') + '<div class="panel"><h2>My Progress</h2>' + rows +
    (list.length ? '<button class="btn btn-ghost btn-full" style="margin-top:14px;" onclick="clearHistory()">Clear (local only)</button>' : '') +
    '<button class="btn btn-ghost btn-full" style="margin-top:8px;" onclick="goBack()">Back</button></div>' +
    renderBottomNav('my') + renderChatFab();
}

<style>
  /* ORDER 43: Dynamic Variables for Admin Branding */
  :root {
    /* Green/Gold/Blue/Yellow mix */
    --bg-light: linear-gradient(135deg, #0a5c36, #1e8449, #1e3c72, #b8860b, #ffd700);
    /* Peep Black Dark Mode */
    --bg-dark: #000000;
    --primary-color: #0a5c36;
    --accent-color: #b8860b;
  }

  /* FIX: Prevents horizontal layout shift when modals open */
  html { scrollbar-gutter: stable; } 

  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui,-apple-system,sans-serif; }
  
  /* ORDER 7: Animated Light Mode */
  /* FIX: Added overflow-x: hidden to prevent side-scrolling */
  body { min-height:100vh; background: var(--bg-light); background-size: 400% 400%; animation: gradientBG 15s ease infinite; display:flex; justify-content:center; align-items:flex-start; padding:12px 12px 100px; color:#ffffff; transition: background .3s, color .3s; touch-action: pan-y; overflow-x: hidden; }
  
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ORDER 8: Peep Black Dark Mode */
  body.dark { background: var(--bg-dark) !important; color:#ffffff !important; animation: none; }
  
  body.admin-mode * { -webkit-user-select: text !important; user-select: text !important; }
  
  /* STRICT COPY PROTECTION: Non-admins cannot select or copy any text */
  body:not(.admin-mode) * { 
    -webkit-user-select: none !important; 
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important; 
    -webkit-touch-callout: none !important; 
  }
  
  /* Allow typing in inputs but prevent copy/paste menus */
  body:not(.admin-mode) input, body:not(.admin-mode) textarea { 
    -webkit-user-select: text !important; 
    user-select: text !important; 
  }
  
  body.blur-sensitive .container { filter: blur(22px) grayscale(1); }
  body.blur-sensitive::after { content: "Protected Content"; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(30,60,114,.85); color: #fff; font-size: 18px; font-weight: 700; z-index: 99999; }
  .container { width:100%; max-width:800px; }

async function pbkdf2Hash(password, saltHex, iterations){
  iterations = iterations || 150000;
  const enc = new TextEncoder();

let _aesKeyCache = null;

  const enc = new TextEncoder();
  const keyMat = await crypto.subtle.importKey('raw', enc.encode(getDeviceId()), 'PBKDF2', false, ['deriveKey']);

  if (!plaintext) return '';
  try { const key = await getDeviceAesKey(); const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(plaintext)); return 'enc$' + bytesToB64(iv) + '$' + bytesToB64(new Uint8Array(ct)); } catch(e){ return plaintext; }

async function aesDecrypt(ciphertext){
  if (!ciphertext || !ciphertext.startsWith('enc$')) return ciphertext || '';
  const parts = ciphertext.split('$');
  try { const key = await getDeviceAesKey(); const iv = b64ToBytes(parts[1]); const ct = b64ToBytes(parts[2]); const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct); return new TextDecoder().decode(pt); } catch(e){ return ''; }

async function verifyPasswordAsync(phone, pw, user){
  const stored = user && user.passwordHash ? user.passwordHash : '';

// UPDATED: Hardware Fingerprint so Device ID NEVER changes, even if cache is cleared
function generateDeviceId(){ 
  try {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const txt = 'DeviceFingerprint!@#$%^&*()';
    ctx.textBaseline = "top";
    ctx.font = "14px 'Arial'";
    ctx.fillStyle = "#f60";
    ctx.fillRect(125,1,62,20);
    ctx.fillStyle = "#069";
    ctx.fillText(txt, 2, 15);
    ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
    ctx.fillText(txt, 4, 17);
    const canvasData = canvas.toDataURL();

    const seed = [
      navigator.userAgent || '', 
      screen.width + 'x' + screen.height, 
      screen.colorDepth || '',
      navigator.language || '', 
      new Date().getTimezoneOffset(), 
      navigator.platform || '', 
      navigator.hardwareConcurrency || '',
      canvasData 
    ].join('|'); 
    
    return simpleHash(seed) + simpleHash(seed + 'salt').slice(0, 4);
  } catch(e) {
    const seed=[navigator.userAgent||'',screen.width+'x'+screen.height,navigator.language||'',new Date().getTimezoneOffset(),navigator.platform||''].join('|'); 
    return simpleHash(seed)+simpleHash(seed+'salt').slice(0,4); 
  }
}

// UPDATED: Trial date strictly follows the Cloud Database (createdAt) so it NEVER resets on code update
function checkAccess(){
  const graceUntil = parseInt(localStorage.getItem(LS_GRACE_UNTIL) || '0');
  if (graceUntil > Date.now()) {
    const hoursLeft = Math.ceil((graceUntil - Date.now()) / (1000 * 60 * 60));
    return { status:'licensed', daysLeft: hoursLeft, grace: true };
  }
  if(isAdminMode()) return { status:'licensed', daysLeft:9999, master:true, admin:true };
  
  const curPhone = getCurrentUserPhone();
  const l = localStorage.getItem(LS_LICENSE);
  if(l) return { status:'licensed', daysLeft:365 };
  
  const u = getCurrentUser(); 
  
  // PRIORITIZE the Cloud registration date
  let fr = (u && u.createdAt) ? parseInt(u.createdAt) : parseInt(localStorage.getItem(LS_FIRST_RUN)||'0'); 
  
  if(!fr){ 
    fr = Date.now(); 
    localStorage.setItem(LS_FIRST_RUN, fr.toString()); 
  } 
  
  const end = fr + (CONFIG.TRIAL_DAYS * 86400000); 
  const now = Date.now(); 
  
  if(now >= end) return {status:'expired',reason:'trial-ended'}; 
  return {status:'trial',daysLeft:Math.ceil((end-now)/86400000)};
}

/* ORDER 25: Fetch from Cloudflare KV (No content.json) */
async function syncRemoteContent() {
  try {
    const res = await fetch(BACKEND_URL + '/api/get-content?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data && data.ok && data.content) {
      const oldStr = localStorage.getItem(LS_SYNCED_CONTENT) || '{}';
      const newStr = JSON.stringify(data.content);
      
      if (oldStr !== newStr) {
        localStorage.setItem(LS_SYNCED_CONTENT, newStr);
        if (data.content.tutorials) saveTutorials(data.content.tutorials);
        if (data.content.universityInfo) localStorage.setItem(LS_UNI_INFO, JSON.stringify(data.content.universityInfo));
        if (data.content.generalSubjects) localStorage.setItem(LS_GENERAL_SUBJECTS, JSON.stringify(data.content.generalSubjects));
        
        // Show Toast only if it's not the very first download
        if (oldStr !== '{}') {
          const latestTab = data.content._latestUpdateTab || 'book';
          showToast('🎉 New content has been added! Tap to view.', latestTab);
        }
        
        // Auto-refresh current screen if applicable
        if (BASE_SCREENS.has(currentScreen) && currentScreen !== 'quiz' && currentScreen !== 'book-viewer' && currentScreen !== 'note-viewer') {
           _renderScreenByName(currentScreen);
        }
      }
    }
  } catch(e) {
    console.log('Offline mode - Using cached content.');
  }
}

  if (!(await appConfirm('Upload all content saved on this phone to the Cloud KV?\n\nThis will overwrite what is currently in the cloud.'))) return;
  const lib = getContentLibrary();

    });

  }

/* ORDER 47: God Mode Repair Tool (Fixes any error without code) */
async function repairAppData() {
  if (!isAdminMode()) return;
  if (!(await appConfirm('🚨 GOD MODE REPAIR:\n\nThis will download the latest clean data from Cloud KV and overwrite any corrupted local data on this phone.\n\nUse this if the app is crashing or content is missing.\n\nProceed?'))) return;
  
  try {
    const res = await fetch(BACKEND_URL + '/api/get-content?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    if (data && data.ok && data.content) {
      localStorage.setItem(LS_SYNCED_CONTENT, JSON.stringify(data.content));
      localStorage.removeItem(LS_CONTENT_DRAFT); // Clear any broken drafts
      await appAlert('✅ App Repaired Successfully! The app will now reload.');
      location.reload();
    } else {
      appAlert('Failed to fetch clean data from Cloud.');
    }
  } catch(e) {
    appAlert('Network error. Cannot connect to Cloud to repair.');
  }
}

function appDialog(type, message, defaultValue){

    overlay.innerHTML = '<div class="overlay-content" style="max-width:380px;">'+inner+'</div>';
    document.body.appendChild(overlay);
    const okBtn = document.getElementById('appDlgOk'); const cancelBtn = document.getElementById('appDlgCancel'); const inputEl = document.getElementById('appDlgInput');
    const cleanup = () => { overlay.remove(); };
    okBtn.onclick = () => { cleanup(); resolve(type === 'prompt' ? (inputEl ? inputEl.value : '') : true); };
    if(cancelBtn) cancelBtn.onclick = () => { cleanup(); resolve(type === 'prompt' ? null : false); };

  });
}

async function loadPdfToCanvas(url, containerId) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = '<div style="padding:20px; text-align:center; font-weight:bold; color:#555;">Loading PDF...</div>';
  try {
    const loadingTask = pdfjsLib.getDocument(url);
    const pdf = await loadingTask.promise;
    container.innerHTML = '';
    
    for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;
      canvas.style.maxWidth = '100%';
      canvas.style.marginBottom = '15px';
      canvas.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
      canvas.style.background = '#fff';
      container.appendChild(canvas);
      
      const renderContext = { canvasContext: context, viewport: viewport };
      await page.render(renderContext).promise;
    }
  } catch (err) {
    console.error(err);
    container.innerHTML = '<div style="padding:20px; text-align:center; color:#c62828; font-weight:bold;">Failed to load PDF directly.<br><a href="'+escapeAttr(url)+'" target="_blank" style="color:#0088cc; display:inline-block; margin-top:10px; padding:10px 20px; border:2px solid #0088cc; border-radius:8px; text-decoration:none;">Open in New Tab</a></div>';
  }
}

async function handleAndroidBack() {
  if (_isInputFocused()) { _dismissKeyboard(); return; }
  if (_screenStack.length > 0) { const prev = _screenStack.pop(); _goingBack = true; try { _renderScreenByName(prev); } finally { setTimeout(() => { _goingBack = false; }, 100); } return; }

async function submitSignIn(){
  const phone = (document.getElementById('siPhone').value || '').trim();
  const pw = document.getElementById('siPw').value;
  const msg = document.getElementById('siMsg');
  const btn = document.getElementById('siSubmitBtn');
  const err = t => { msg.innerHTML = '<div style="color:#c62828; font-weight:600;">' + t + '</div>'; };
  const ok  = t => { msg.innerHTML = '<div style="color:#2e7d32; font-weight:600;">' + t + '</div>'; };
  if (!/^(09|07)\d{8}$/.test(phone)) return err('Enter valid phone (09/07 + 8 digits).');
  if (!isValidPassword(pw)) return err('Password must be at least 4 characters.');
  if (isPhoneBlacklisted(phone)) { err('Account blocked.'); setTimeout(() => renderBlockedScreen(), 1200); return; }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Verifying…'; }

  try {
    const res = await backendLogin(phone, pw);
    if (!res || !res.ok) {
      if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
      if (res && res.err === 'device_conflict') {
        await appAlert('🔒 This account is already logged in on another phone.\n\nOnly one device is allowed per user. Contact admin to unbind your old device.');
        return err('Blocked: already logged in on another device.');
      }
      if (res && res.err === 'wrong-password') return err('Wrong password. Please try again.');
      if (res && res.err === 'not-found') return err('No account found for this phone. Please sign up first.');
      return err('Sign-in failed: ' + ((res && res.err) || 'unknown'));
    }

    const user = res.user;
    user.deviceId = getDeviceId();
    user.deviceHash = getDeviceHash();
    saveUser(user);
    setCurrentUserPhone(phone);
    saveProfileData({ name: user.name, phone: user.phone, university: user.university, stream: user.stream });
    setUniversity(user.university);
    setCheckedIn();
    startSession(phone);
    markPhoneUsed(phone);
    
    // ADDED: Force the app to save the true cloud date to local storage so the trial NEVER resets
    if (user.createdAt) localStorage.setItem(LS_FIRST_RUN, String(user.createdAt)); 

    ok('✓ Signed in!');
    pushStatusToServer();

    if (res.mustChangePassword) {
      setTimeout(() => { _clearNavStack(); renderForceChangePassword(); }, 400);
      return;
    }

    setTimeout(() => {
      showPostAuthWarning(() => {
        _clearNavStack();
        switchTab('book');
      });
    }, 400);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
    err('Sign-in failed. Please try again.');
  }
}

/* ORDER 35, 36, 48, 49: Updated Switch Tab */
function switchTab(tab){
  _clearNavStack(); saveScrollNow();
  if(BASE_TABS[tab]) _lastBaseTab = tab;
  if(quizState.timerId && currentScreen === 'quiz'){ clearInterval(quizState.timerId); quizState = {}; }
  if(currentScreen !== 'book-viewer' && currentScreen !== 'note-viewer') _viewerState = null;
  if(isBlocked() || isDeviceBlacklisted()){ setBlocked(true); renderBlockedScreen(); return; }
  if(isKeyLocked()){ renderKeyBlockedScreen(); return; }
  if(isClosureDay()){ renderClosureScreen(); return; }
  
  // ORDER 36: Prompt guest on 'My' tab using the new Auth Choice
  if(tab === 'my'){ 
    if(!isSignedIn()){
      if (currentScreen !== 'auth' && currentScreen !== 'force-change-pw' && currentScreen !== 'reset-code') {
        showAuthChoice('You need to Sign Up or Sign In to access your profile, progress, and premium features.');
        return;
      }
    }
    setScreen('my'); renderMy(); return; 
  }
  
  const accessNow = checkAccess(); const signedIn = isSignedIn() && hasActiveSession();
  if(signedIn && accessNow.status === 'expired'){ renderPaymentFlow(tab); return; }
  if(tab === 'university'){ setScreen('university-info'); renderUniversityInfo(); return; }
  if(tab === 'book'){ if(isSemesterPickNeeded()){ setScreen('semester'); renderSemesterPicker('book'); return; } setScreen('book'); renderBooksHome(); }
  else if(tab === 'note'){ if(isSemesterPickNeeded()){ setScreen('semester'); renderSemesterPicker('note'); return; } setScreen('note'); renderNotesHome(); }
  else if(tab === 'exam'){ if(isSemesterPickNeeded()){ setScreen('semester'); renderSemesterPicker('exam'); return; } setScreen('exam-home'); renderExamHome(); }
  else if(tab === 'coc'){ setScreen('coc-home'); renderCocHome(); }
  else if(tab === 'weekly'){ setScreen('weekly-home'); renderWeeklyHome(); } /* ORDER 49 */
}

function setBookZoom(z){

  const lbl=document.getElementById('bookZoomPct');

function prepareQuestions(qs){ return qs.map(q=>{ 
  if(q.options && q.options.length > 0) {
    const ct=q.options[q.answer]; const opts=shuffle(q.options); 
    return {q:q.q,options:opts,answer:opts.indexOf(ct),explanation:q.explanation}; 
  } else {
    return {q:q.q, options: q.options || [q.answerText||''], answer: 0, explanation:q.explanation, isShort: true}; 
  }
}); }

function selectOption(qIndex, optIndex) {
  if (quizState.revealed[qIndex] || !quizState.isPracticeMode && quizState.answers[qIndex] !== -1) {
     if (quizState.isPracticeMode) return;
  }
  const q = quizState.questions[qIndex];
  quizState.answers[qIndex] = optIndex;
  q.options.forEach((_, j) => {
    const el = document.getElementById(`opt_${qIndex}_${j}`);
    if(el) el.classList.remove('selected', 'wrong-selected');
  });
  document.getElementById(`opt_${qIndex}_${optIndex}`).classList.add('selected');
  if (quizState.isPracticeMode) {
    quizState.revealed[qIndex] = true;
    const isCorrect = optIndex === q.answer;
    if (!isCorrect) document.getElementById(`opt_${qIndex}_${optIndex}`).classList.add('wrong-selected');
    document.getElementById(`opt_${qIndex}_${q.answer}`).classList.add('selected');
    showFeedback(qIndex, isCorrect, isCorrect ? '✅ Correct!' : '❌ Incorrect');
  }
  const dot = document.getElementById(`dot_${qIndex}`);
  if (dot) { 
    dot.classList.add(quizState.isPracticeMode ? (optIndex === q.answer ? 'answered' : 'wrong') : 'answered'); 
  }
}

function checkSmartMatch(userStr, correctStr) {
  if (!userStr || !correctStr) return false;
  const u = userStr.toLowerCase().trim();
  const c = correctStr.toLowerCase().trim();
  if (u === c) return true;
  const stopWords = ['the','a','is','of','in','and','to','for','it','on','with'];
  const uWords = u.split(' ').filter(w => w.length > 2 && !stopWords.includes(w));
  const cWords = c.split(' ').filter(w => w.length > 2 && !stopWords.includes(w));
  let matches = 0;
  uWords.forEach(uw => { if (cWords.some(cw => cw.includes(uw) || uw.includes(cw))) matches++; });
  return matches >= 1 && uWords.length > 0;
}

function submitShortAnswer(qIndex) {
  if (quizState.revealed[qIndex]) return;
  const input = document.getElementById(`sa_input_${qIndex}`);
  const val = input ? input.value.trim() : '';
  if (!val) return appAlert('Please type an answer.');
  const q = quizState.questions[qIndex];
  const correctStr = q.options[q.answer];
  const isMatch = checkSmartMatch(val, correctStr);
  if (isMatch) {
    quizState.answers[qIndex] = q.answer;
    quizState.revealed[qIndex] = true;
    document.getElementById(`dot_${qIndex}`).classList.add('answered');
    showFeedback(qIndex, true, '✅ Correct! (Smart Match)');
    if (input) input.disabled = true;
  } else {
    appConfirm(`The correct answer is: \n"${correctStr}"\n\nDid you get it right?`).then(isRight => {
      quizState.revealed[qIndex] = true;
      document.getElementById(`dot_${qIndex}`).classList.add(isRight ? 'answered' : 'wrong');
      if (isRight) {
        quizState.answers[qIndex] = q.answer;
        showFeedback(qIndex, true, '✅ Correct (Self-Graded)');
      } else {
        showFeedback(qIndex, false, '❌ Incorrect');
      }
      if (input) input.disabled = true;
    });
  }
}

// UPDATED: Shows exact backend error if AI fails
async function aiGradeAnswer(qIndex) {
  if (!navigator.onLine) return appAlert('⚠️ Internet is required for AI features. Please connect to the internet and try again.');
  const input = document.getElementById(`sa_input_${qIndex}`);
  const val = input ? input.value.trim() : '';
  if (!val) return appAlert('Please type an answer first.');
  const q = quizState.questions[qIndex];
  const correctStr = q.options[q.answer];
  const btn = document.querySelector(`#short_ans_${qIndex} button.btn-telegram`);
  if(btn) { btn.disabled = true; btn.textContent = '⏳ Grading...'; }
  try {
    const res = await fetch(BACKEND_URL + '/api/ai/grade', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ question: q.q, correctAnswer: correctStr, userAnswer: val })
    });
    const data = await res.json();
    if (data.ok) {
      quizState.revealed[qIndex] = true;
      if (data.isCorrect) {
        quizState.answers[qIndex] = q.answer;
        document.getElementById(`dot_${qIndex}`).classList.add('answered');
        showFeedback(qIndex, true, '🤖 Correct! (AI Verified)');
      } else {
        document.getElementById(`dot_${qIndex}`).classList.add('wrong');
        showFeedback(qIndex, false, '🤖 Incorrect (AI Verified)');
      }
      if (input) input.disabled = true;
    } else {
      // SHOW THE REAL ERROR
      appAlert('AI grading failed: ' + (data.err || 'Unknown error') + '\n\nPlease use Offline mode.');
    }
  } catch(e) {
    appAlert('Network error with AI: ' + e.message);
  } finally {
    if(btn) { btn.disabled = false; btn.textContent = '🤖 Grade with AI'; }
  }
}

function showFeedback(qIndex, isCorrect, msg) {
  const fb = document.getElementById(`fb_${qIndex}`);
  if (!fb) return;
  const q = quizState.questions[qIndex];
  let html = `<div style="margin-top:14px; padding:12px 14px; border-radius:10px; background:${isCorrect ? '#e8f5e9' : '#ffebee'}; border-left:4px solid ${isCorrect ? '#4caf50' : '#f44336'}; font-size:13.5px; font-weight:700; color:${isCorrect ? '#2e7d32' : '#c62828'};">

  if (q.explanation) {
    html += `<div style="margin-top:10px; padding:14px; border-radius:10px; background:#fff8e1; border-left:4px solid #ffc107; font-size:13.5px; line-height:1.7; color:#5d4037;">

  fb.style.display = 'block';
}

function finishExam(autoTimeout){
  clearInterval(quizState.timerId); currentScreen = quizState.returnScreen || 'exam-home';
  updateScreenshotGuard();
  const total=quizState.questions.length;
  let score=0; quizState.questions.forEach((q,i)=>{ if(quizState.answers[i]===q.answer) score++; });

const getHistory=()=>JSON.parse(localStorage.getItem('fs_hub_history')||'[]');
function saveHistory(e){
  const h=getHistory(); h.unshift(e);
  localStorage.setItem('fs_hub_history', JSON.stringify(h.slice(0,30)));
  
  let phone = getCurrentUserPhone();
  if (!phone) phone = 'GUEST_' + getDeviceHash(); // Track guest progress in DB
  
  const payload = { phone, subject: e.subject, score: e.score, total: e.total, at: e.date || Date.now() };
  fetch(BACKEND_URL + '/api/save-progress', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify(payload)
  }).catch(()=>{});
}
function clearHistory(){ appConfirm('Clear local history?').then(ok=>{ if(!ok) return; localStorage.removeItem('fs_hub_history'); renderProgress(); }); }
function computeStats(){ const h=getHistory(); let s=0,b=0,w=100; h.forEach(x=>{ const p=(x.score/x.total)*100; s+=p; if(p>b)b=p; if(p<w)w=p; }); return { total:h.length, avg:h.length?Math.round(s/h.length):0, best:Math.round(b), worst:h.length?Math.round(w):0 }; }

async function submitResetWithCode() {
  const phone = (document.getElementById('rcPhone').value || '').trim();
  const code = (document.getElementById('rcCode').value || '').trim();
  const pw1 = document.getElementById('rcPw1').value;
  const pw2 = document.getElementById('rcPw2').value;
  const msg = document.getElementById('rcMsg');
  const err = t => { msg.innerHTML = '<div style="color:#c62828; font-weight:600;">' + t + '</div>'; };
  if (!/^(09|07)\d{8}$/.test(phone)) return err('Enter valid phone.');
  if (!/^\d{6}$/.test(code)) return err('Code must be 6 digits.');
  if (!isValidPassword(pw1)) return err('Min 4 characters.');
  if (pw1 !== pw2) return err('Passwords do not match.');

  const newHash = await hashPasswordNew(pw1);
  try {
    const r = await fetch(BACKEND_URL + '/api/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, code, newPasswordHash: newHash })
    });
    const data = await r.json();
    if (!data || !data.ok) {
      if (data && data.err === 'code-expired') return err('Code expired. Ask admin for a new one.');
      if (data && data.err === 'wrong-code') return err('Wrong code.');
      if (data && data.err === 'no-code') return err('No reset code found. Contact admin.');
      return err('Failed: ' + ((data && data.err) || 'unknown'));
    }
    await appAlert('✅ Password reset! Please sign in with your new password.');
    renderSignIn();
  } catch (e) { err('Network error.'); }
}

async function adminGenerateActivationKey(){
  const hashEl = document.getElementById('actDeviceHash'); 
  const usesEl = document.getElementById('actMaxUses');
  const out = document.getElementById('actResult');
  const hash = (hashEl.value||'').trim().toUpperCase(); 
  const maxUses = parseInt(usesEl.value) || 1;
  if(hash && !/^[A-Z0-9]{6}$/.test(hash)){ out.innerHTML='<div style="color:#c62828;font-weight:700;">ID must be exactly 6 letters/numbers.</div>'; return; }
  
  out.innerHTML = '<div style="color:#666;">Generating...</div>';
  try {
    const r = await fetch(BACKEND_URL + '/api/admin/generate-key', {
      method: 'POST', headers: adminHeaders(),
      body: JSON.stringify({ maxUses: maxUses, targetDeviceId: hash })
    });
    const data = await r.json();
    if(!data.ok) { out.innerHTML = '<div style="color:#c62828;">Failed: ' + data.err + '</div>'; return; }
    
    const key = data.key;
    const tg = 'https://t.me/share/url?url='+encodeURIComponent(key)+'&text='+encodeURIComponent('Your All Freshman ET activation key:');
    out.innerHTML = '<div style="background:#e8f5e9;border:2px solid #4caf50;border-radius:14px;padding:18px;text-align:center;">'+
      '<div style="font-size:11px;color:#2e7d32;font-weight:800;letter-spacing:1px;margin-bottom:8px;">LICENSE KEY ('+maxUses+' USE)</div>'+
      '<div style="font-family:monospace;font-size:20px;font-weight:900;color:#2e7d32;letter-spacing:2px;word-break:break-all;margin-bottom:14px;">'+key+'</div>'+
      '<div style="font-size:12px;color:#c62828;margin-bottom:10px;">Expires in 7 days</div>'+
      '<button class="btn btn-primary btn-full" onclick="adminCopyKey(\''+key+'\')">📋 Copy Key</button>'+
      '<a href="'+tg+'" target="_blank" class="btn btn-telegram btn-full" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">📨 Share via Telegram</a></div>';

  }

  try {
    const r = await fetch(BACKEND_URL + '/api/activate-key', {

      msg.innerHTML='<div style="color:#2e7d32; font-weight:700;">✅ Activated! Unlocking…</div>';

  }

window.deleteNavTab = async function(id) {
  if(!(await appConfirm('Delete this tab?'))) return;
  const s = getSettings();
  if(s.NAV_TABS) {
    s.NAV_TABS = s.NAV_TABS.filter(t => t.id !== id);
    saveSettings(s); reloadConfig();
  }
  
  const coreTabs = ['book', 'note', 'exam', 'coc', 'university', 'weekly'];
  if(coreTabs.includes(id)) {
    if(await appConfirm('Do you also want to permanently delete ALL content in this tab from the cloud?')) {
       const lib = getContentLibrary();
       let changed = false;
       Object.keys(lib).forEach(uni => {
         Object.keys(lib[uni]).forEach(stream => {
           Object.keys(lib[uni][stream]).forEach(sem => {
             const c = lib[uni][stream][sem];
             const targetKey = id === 'book' ? 'pdfs' : id === 'note' ? 'notes' : id === 'exam' ? 'exams' : id === 'coc' ? 'cocs' : id === 'weekly' ? 'weekly' : null;
             if(targetKey && c[targetKey] && c[targetKey].length > 0) {
               c[targetKey] = [];
               changed = true;
             }
           });
         });
       });
       if(changed) {
         saveContentLibrary(lib);
         try {
           await fetch(BACKEND_URL + '/api/admin/save-content', { method: 'POST', headers: adminHeaders(), body: JSON.stringify({ content: lib }) });
           await appAlert('✅ Tab and its content deleted.');
         } catch(e) { appAlert('Network error deleting content.'); }
       }
    }
  }
  renderAdminNavManager();
}

}

async function adminDeleteSelected(type){
  if (adminSelected.size === 0) return appAlert('Nothing selected.');

  const uni = adminEditState.uni; const stream = adminEditState.stream; const sem = adminEditState.semester || 1;
  const c = getUniContent(uni, stream, sem);
  let arr;
  if (type === 'book') arr = c.pdfs;
  else if (type === 'note') arr = c.notes;
  else if (type === 'exam') arr = c.exams;
  else if (type === 'coc') { c.cocs = c.cocs || []; arr = c.cocs; }
  const indices = Array.from(adminSelected).sort((a,b)=>b-a);
  indices.forEach(i => { if (i >= 0 && i < arr.length) arr.splice(i, 1); });
  setUniContent(uni, stream, sem, c);
  const count = indices.length;
  adminResetBulkSelection();
  await appAlert('✅ Deleted ' + count + ' item(s).');
  renderAdminContentManager(type);
}

    if (action === 'move') { indices.slice().sort((a,b)=>b-a).forEach(i => { if (i>=0 && i<arrSrc.length) arrSrc.splice(i,1); }); }
    setUniContent(tUni, tStream, tSem, tgtC);
    if (action === 'move') setUniContent(srcUni, srcStream, srcSem, srcC);
    overlay.remove();
    adminResetBulkSelection();
    await appAlert('✅ ' + itemsToCopy.length + ' item(s) ' + (action==='copy'?'copied':'moved') + ' to ' + tUni + ' · ' + tStream + ' · Sem ' + tSem);
    renderAdminContentManager(type);
  };
}

window.moveContent = function(type, index, direction) {
  const uni = adminEditState.uni;
  const stream = adminEditState.stream;
  const sem = adminEditState.semester || 1;
  const c = getUniContent(uni, stream, sem);
  let arr;
  if (type === 'book') arr = c.pdfs;
  else if (type === 'note') arr = c.notes;
  else if (type === 'exam') arr = c.exams;
  else if (type === 'coc') arr = c.cocs;

  if (direction === 'up' && index > 0) {
    [arr[index - 1], arr[index]] = [arr[index], arr[index - 1]];
  } else if (direction === 'down' && index < arr.length - 1) {
    [arr[index + 1], arr[index]] = [arr[index], arr[index + 1]];
  }
  setUniContent(uni, stream, sem, c);
  renderAdminContentManager(type);
};

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 2 * 1024 * 1024) { 
      return reject(new Error("File is too large! Max size is 2MB. Please use a URL for large files."));
    }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

async function adminAddBook(uni,stream,sem){

      const fileInput = document.getElementById('pdf_file');
      if(fileInput.files.length === 0) return appAlert('Select a file');

  const targets = adminEditState.addToUnis && adminEditState.addToUnis.size ? Array.from(adminEditState.addToUnis) : [uni];

let adminTapCount = 0, adminTapTimer = null;
async function adminTap() {
  adminTapCount++;
  clearTimeout(adminTapTimer);
  adminTapTimer = setTimeout(() => { adminTapCount = 0; }, 2000);
  if (adminTapCount < CONFIG.ADMIN_TAPS_REQUIRED) return;
  adminTapCount = 0;

  if (isAdminMode()) {
    if (await appConfirm('Turn OFF admin mode?')) { setAdminMode(false); renderMy(); }
    return;
  }
  if (!getCurrentUserPhone()) { await appAlert('Sign in first.'); return; }

  const pw = await appPrompt('Admin password:');
  if (pw === null) return;

  let step1;
  try {
    const r = await fetch(BACKEND_URL + '/api/admin-login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: getCurrentUserPhone(), password: pw })
    });
    step1 = await r.json();
  } catch (e) { return appAlert('Network error.'); }

  if (!step1 || !step1.ok) {
    if (step1 && step1.err === 'locked') {
      const mins = Math.ceil((step1.until - Date.now()) / 60000);
      return appAlert('Locked for ' + mins + ' minute(s).');
    }
    if (step1 && step1.err === 'email-failed') {
      return appAlert('Password correct, but email could not be sent.\n\nDetail: ' + (step1.detail || 'unknown') + '\n\nCheck RESEND_API_KEY and admin_email.');
    }
    return appAlert('Admin Login Failed.\nReason: ' + (step1 ? step1.err : 'Network Error'));
  }

  await appAlert('📧 A code was sent to:\n\n' + (step1.sentTo || 'your admin email') + '\n\nCheck your inbox and spam. The code expires in 5 minutes.');

  const typed = await appPrompt('Enter the code from your email:');
  if (typed === null) return;

  let step2;
  try {
    const r = await fetch(BACKEND_URL + '/api/admin-verify-otp', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ challengeToken: step1.challengeToken, otp: String(typed).trim().toUpperCase() })
    });
    step2 = await r.json();
  } catch (e) { return appAlert('Network error.'); }

  if (!step2 || !step2.ok) {
    if (step2 && step2.err === 'locked') {
      const mins = Math.ceil((step2.until - Date.now()) / 60000);
      return appAlert('Too many wrong attempts. Locked for ' + mins + ' minute(s).');
    }
    if (step2 && step2.err === 'otp-expired') {
      return appAlert('⏱ The 5-minute code has expired. Tap the footer 7 times to start over.');
    }
    if (step2 && step2.err === 'challenge-expired') {
      return appAlert('Session expired. Tap the footer 7 times to start over.');
    }
    if (step2 && step2.err === 'wrong-otp') {
      return appAlert('Wrong code. Attempts remaining: ' + (step2.remaining || 0));
    }
    if (step2 && step2.err === 'no-otp') {
      return appAlert('No pending code. Tap the footer 7 times to start over.');
    }
    return appAlert('Verification failed.');
  }

  setAdminToken(step2.adminToken);
  setAdminMode(true);
  await appAlert('✅ Admin mode ON (expires in 24 hours).');
  renderMy();
}

function parseQuestions(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const questions=[]; let current=null, answerKeyMode=false; const answerKey={};
  for(const line of lines){
    if(/^answer\s*key\b/i.test(line)||/^answers?\s*[:\-]?\s*$/i.test(line)){ if(current&&current.options.length>=2){ questions.push(current); current=null; } answerKeyMode=true; continue; }
    if(answerKeyMode){ const m=line.match(/^(\d+)\s*[.):\-]\s*([A-Da-d])\b/); if(m) answerKey[parseInt(m[1])]=m[2].toUpperCase(); continue; }
    const aM=line.match(/^(?:answer|ans)\s*[:\-]?\s*([A-Da-d])\b/i); if(aM&&current){ current.inlineAnswer=aM[1].toUpperCase(); continue; }
    const eM=line.match(/^(?:explanation|why|reason)\s*[:\-]\s*(.+)/i); if(eM&&current){ current.explanation=eM[1].trim(); continue; }
    const qM=line.match(/^(\d+)\s*[.)]\s+(.+)/); const oM=line.match(/^([A-Da-d])\s*[.)]\s+(.+)/);
    if(qM){ if(current&&current.options.length>=2) questions.push(current); current={q:qM[2].trim(),options:[]}; }
    else if(oM&&current){ current.options.push(oM[2].trim()); }
    else if(current){ if(current.options.length===0) current.q+=' '+line; else current.options[current.options.length-1]+=' '+line; }
  }
  if(current&&current.options.length>=2) questions.push(current);
  questions.forEach((q,i)=>{ const l=q.inlineAnswer||answerKey[i+1]; if(l) q.answer=l.charCodeAt(0)-65; delete q.inlineAnswer; });
  return questions.filter(q=>q.options.length>=2);
}

  const trial = users.filter(u => u.status==='trial' && u.master!==1 && u.role!=='admin' && !String(u.phone).startsWith('GUEST_')).length;
  const guestTrial = users.filter(u => String(u.phone).startsWith('GUEST_')).length;
  const expired = total - licensed - trial - guestTrial;
  const today = new Date().toDateString();
  const todayCount = users.filter(u => u.createdAt && new Date(u.createdAt).toDateString()===today).length;

  const box = (key, n, label, color) => {
    const isActive = (currentFilter === key);
    const border = isActive ? 'border: 3px solid #6a3093; transform: scale(0.98);' : 'border: 3px solid transparent;';
    return '<div class="stat-box" onclick="filterAdminUsers(\''+key+'\')" style="background:'+color+'; cursor:pointer; '+border+' transition:0.2s;">'+

    '<p style="font-size:11px;color:#888;margin-bottom:8px;">Tap a box to filter users below</p>'+

}

window.filterAdminUsers = function(filterKey) {
  window._adminStatsFilter = filterKey;
  const users = window._adminStatsUsers || [];
  const today = new Date().toDateString();
  
  let filteredUsers = users;
  if (filterKey === 'licensed') filteredUsers = users.filter(u => u.status==='licensed' || u.master===1 || u.role==='admin');
  else if (filterKey === 'trial') filteredUsers = users.filter(u => u.status==='trial' && u.master!==1 && u.role!=='admin' && !String(u.phone).startsWith('GUEST_'));
  else if (filterKey === 'guestTrial') filteredUsers = users.filter(u => String(u.phone).startsWith('GUEST_'));
  else if (filterKey === 'expired') filteredUsers = users.filter(u => u.status!=='licensed' && u.master!==1 && u.role!=='admin' && u.status!=='trial' && !String(u.phone).startsWith('GUEST_'));
  else if (filterKey === 'today') filteredUsers = users.filter(u => u.createdAt && new Date(u.createdAt).toDateString()===today);

  const title = document.getElementById('adminStatsTitle');
  if(title) title.innerHTML = 'Users ('+filteredUsers.length+')';

  const userRows = filteredUsers.length ? filteredUsers.map(u => {
    let badge = '';
    const st = String(u.status||'trial').toLowerCase();
    const isGuest = String(u.phone).startsWith('GUEST_');
    
    if(u.role==='admin'||u.master===1) badge = '<span style="background:#6a3093;color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">👑 ADMIN</span>';
    else if(st==='licensed') badge = '<span style="background:#e8f5e9;color:#2e7d32;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">🟢 LICENSED</span>';
    else if(isGuest) badge = '<span style="background:#ffe0b2;color:#e65100;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">👤 GUEST TRIAL</span>';
    else if(st==='trial') badge = '<span style="background:#fff3cd;color:#856404;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">🟡 TRIAL</span>';
    else badge = '<span style="background:#ffebee;color:#c62828;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">🔴 EXPIRED</span>';
    
    return '<div onclick="openUserEditorFor(\'' + u.phone + '\')" style="display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f7f7fa;border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;font-size:13px;">'+
      '<div style="flex:1;min-width:0;">'+
        '<div style="font-weight:700;color:#333;">'+escapeHtml(u.name||'Guest User')+'</div>'+
        '<div style="font-size:11px;color:#888;">'+escapeHtml(u.phone||'-')+' · '+escapeHtml(u.university||'-')+'</div>'+
      '</div>'+
      badge+'<span style="color:#6a3093;font-weight:800;font-size:18px;">›</span></div>';
  }).join('') : '<div class="empty-msg">No users in this category.</div>';

  const listContainer = document.getElementById('analytics-user-list');
  if(listContainer) listContainer.innerHTML = userRows;
};

async function saveUserEdit(phone){
  if(!(await appConfirm('Save all changes for this user?'))) return;
  
  const name = document.getElementById('ueName').value.trim();
  const university = document.getElementById('ueUni').value;
  const stream = document.getElementById('ueStream').value;
  const status = document.getElementById('ueStatus').value;
  const daysLeft = parseInt(document.getElementById('ueDays').value)||0;
  const role = document.getElementById('ueRole').value;
  const master = role === 'admin' ? 1 : 0;
  let passwordHash = null;
  
  const pw = document.getElementById('uePw').value;
  if(pw && pw.length >= 4){ passwordHash = await hashPasswordNew(pw); }

  try {
    const r = await fetch(BACKEND_URL+'/api/admin/edit-user', {
      method:'POST', headers:adminHeaders(),
      body: JSON.stringify({ phone, name, university, stream, status, daysLeft, role, master, passwordHash })
    });
    const d = await r.json();
    if(d && d.ok){ await appAlert('✅ User fully updated.'); openUserEditor(); }
    else appAlert('Failed: '+((d&&d.err)||'unknown'));
  } catch(e){ appAlert('Network error.'); }
}

async function fetchSettingsFast(){
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 3000);
    const r = await fetch(BACKEND_URL + '/api/get-settings', { signal: ctrl.signal });
    clearTimeout(t);
    const data = await r.json();
    if (data && data.ok && data.settings && Object.keys(data.settings).length > 0) {
      const currentSettings = getSettings();
      const merged = { ...currentSettings, ...data.settings };
      saveSettings(merged);
      reloadConfig();
      return true;
    }
  } catch(e) {}
  return false;
}

<!-- 🚨 UPDATE BANNER SCRIPT GOES RIGHT HERE 🚨 -->
<script>
if ('serviceWorker' in navigator) {
  let newWorker;

  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBanner();
        }
      });
    });
  }).catch(err => console.log('SW error:', err));

  let refreshing;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  function showUpdateBanner() {
    if (document.getElementById('sw-update-banner')) return;

    const banner = document.createElement('div');
    banner.id = 'sw-update-banner';
    banner.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#0a5c36,#b8860b); color:#fff; padding:14px 20px; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,0.5); z-index:999999; display:flex; flex-direction:column; gap:10px; align-items:center; width:90%; max-width:400px; text-align:center; border:2px solid #ffd700;';
    
    banner.innerHTML = `
      <div style="font-weight:800; font-size:15px; text-shadow:0 1px 2px rgba(0,0,0,0.5);">🎉 A New Update is Available!</div>
      <div style="font-size:12px; opacity:0.9;">Please update to get the latest exams, notes, and bug fixes.</div>
      <button id="sw-update-btn" style="background:#fff; color:#0a5c36; border:none; padding:10px 24px; border-radius:20px; font-weight:900; font-size:14px; cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,0.2);">Update Now</button>
    `;
    
    document.body.appendChild(banner);

    document.getElementById('sw-update-btn').onclick = () => {
      banner.innerHTML = '<div style="font-weight:800; font-size:14px;">Updating... Please wait 🚀</div>';
      if (newWorker) {
        newWorker.postMessage({ type: 'SKIP_WAITING' });
      }
    };
  }
}
</script>

name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install dependencies
        run: npm install

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks
          else
            keytool -genkey -v \
              -keystore android-keystore.jks \
              -alias allfreshman \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass TempPass2026 \
              -keypass TempPass2026 \
              -dname "CN=All Freshman ET, OU=Mobile, O=Osee, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

      - name: Force-create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.osee6308.allfreshman",
            "appName": "All Freshman ET",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          npx cap sync

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Force Replace Android Icons
        run: |
          ICON=""
          for f in "www/icon-512.png" "icon-512.png" "www/logo.png" "logo.png"; do
            if [ -f "$f" ]; then ICON="$f"; break; fi
          done

          if [ -z "$ICON" ]; then
            echo "❌ ERROR: No icon file found!"
            exit 1
          fi
          echo "✅ Using icon: $ICON"

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          convert "$ICON" -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert "$ICON" -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert "$ICON" -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert "$ICON" -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert "$ICON" -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png

          MIPMAP_DIR="android/app/src/main/res/mipmap-anydpi-v26"
          if [ -d "$MIPMAP_DIR" ]; then
            rm -rf "$MIPMAP_DIR"
            echo "🗑️ Deleted adaptive icon XML folder"
          fi
          
          find android/app/src/main/res -name "ic_launcher.xml" -exec rm -f {} \;
          find android/app/src/main/res -name "ic_launcher_round.xml" -exec rm -f {} \;
          echo "✅ Icons forced successfully!"

      - name: Overwrite MainActivity with FLAG_SECURE and BackButton Fix
        run: |
          FILE=$(find android -name MainActivity.java | head -1)
          PKG=$(grep '^package ' "$FILE" | sed 's/package //;s/;//')
          cat > "$FILE" <<EOF
          package $PKG;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);
              }

              @Override
              public void onBackPressed() {
                  if (this.bridge != null && this.bridge.getWebView() != null && this.bridge.getWebView().canGoBack()) {
                      this.bridge.getWebView().goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          grep -q "onBackPressed" "$FILE" && echo "OK: Back button fix applied"

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=TempPass2026 \
            -Pandroid.injected.signing.key.alias=allfreshman \
            -Pandroid.injected.signing.key.password=TempPass2026

      - name: Build signed APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=TempPass2026 \
            -Pandroid.injected.signing.key.alias=allfreshman \
            -Pandroid.injected.signing.key.password=TempPass2026

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup keystore
        if: always()
        run: rm -f android-keystore.jks
